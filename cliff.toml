# git-cliff configuration for CHANGELOG generation
# Documentation: https://git-cliff.org/docs/configuration

[changelog]
# Header template
header = """
# Changelog

All notable changes to this project are documented in this file.

Based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/).

"""

# Template for each release
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}({{ commit.scope }}) {% endif %}\
          {{ commit.message | upper_first }}\
          {% if commit.body %}\n\n{{ commit.body | indent(prefix="  ") }}{% endif %}\
    {% endfor %}
{% endfor %}\n
"""

# Footer template
footer = """
---
*Generated by [git-cliff](https://git-cliff.org/)*
"""

# Trim leading/trailing whitespace
trim = true

[git]
# Parse conventional commits
conventional_commits = true
filter_unconventional = true
split_commits = false

# Commit groups (mapping type -> CHANGELOG section)
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^doc", group = "Documentation" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^style", group = "Style" },
    { message = "^test", group = "Tests" },
    { message = "^build", group = "Build" },
    { message = "^ops", group = "Ops" },
    { message = "^chore", group = "Maintenance" },
    # Skip certain commits
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(deps\\)", skip = true },
    { message = "^Merge", skip = true },
]

# Protect breaking change commits
protect_breaking_commits = true

# Filter commits
filter_commits = true

# Tag pattern for versions
tag_pattern = "v[0-9].*"

# Sort by date (newest first)
sort_commits = "newest"

services:
  stt:
    container_name: talk-server
    build: .
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    env_file: .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/tokens.db
    ports:
      - "8000:8000"
    volumes:
      - ./rest:/app/rest
      - model-cache:/app/.cache
      - token-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

volumes:
  model-cache:
  token-data:
